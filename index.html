<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4F0E9" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Khuzam Studio" />
    <meta name="description" content="Bait Khuzam Studio — private interior design workspace · استوديو بيت خزام" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>استوديو بيت خزام</title>
    <script>
      // Apply the saved language before the first paint (default: Arabic, right-to-left).
      try {
        var p = JSON.parse(localStorage.getItem('bk.locale') || '{}');
        if (p.lang === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
          document.title = 'Bait Khuzam Studio';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
